{% extends "base.html" %}

{% block content %}
    <h1>Editar Post</h1>
    
    <form action="{{ url_for('edit_post', post_id=post.id) }}" method="post">
        
        <p>
            <label for="post_body">Conteúdo do Post:</label><br>
            <textarea name="post_body" rows="5" cols="60" required>{{ post.body }}</textarea>
        </p>

        <p>
            <input type="submit" value="Salvar Edição">
            <a href="{{ url_for('index') }}">Cancelar</a>
        </p>
    </form>
{% endblock %}
